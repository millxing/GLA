<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/basketball.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://www.nbaextrapass.xyz" />
    <title>Extra Pass Analytics</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Extra Pass Analytics" />
    <meta
      name="description"
      content="Advanced statistics and analysis on NBA teams"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Extra Pass Analytics" />
    <meta
      property="og:description"
      content="Advanced statistics and analysis on NBA teams"
    />
    <meta property="og:url" content="https://www.nbaextrapass.xyz" />
    <meta property="og:site_name" content="Extra Pass Analytics" />
    <meta
      property="og:image"
      content="https://www.nbaextrapass.xyz/og-image.png"
    />
    <meta property="og:image:alt" content="EPA logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Extra Pass Analytics" />
    <meta
      name="twitter:description"
      content="Advanced statistics and analysis on NBA teams"
    />
    <meta
      name="twitter:image"
      content="https://www.nbaextrapass.xyz/og-image.png"
    />
    <meta name="twitter:image:alt" content="EPA logo" />
  </head>
